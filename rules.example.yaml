# Правила бота. Скопируйте в rules.yaml и заполните под себя.
#
# Файл делится на секции по задачам. Задача включается, если её секция непустая;
# нужна лишь одна — вторую можно не заводить. У каждой задачи своё расписание,
# см. MOVE_CRON_SCHEDULE и MENTIONS_CRON_SCHEDULE в .env.
#
# ID страницы видно в её URL: .../pages/viewpage.action?pageId=123456
# либо через «…» → Page Information.


# ── rules: перенос страниц по лейблам ────────────────────────────────────────
# Каждое правило — связка «откуда → куда по лейблам»:
#   source  — ID страницы-источника: берутся страницы из её поддерева (любая глубина).
#             Ровно один; в разных правилах не должен повторяться.
#   labels  — лейблы, по которым отбираются страницы. Несколько = ИЛИ:
#             достаточно любого из них.
#   target  — ID страницы-назначения. Ровно один: страница не может лежать
#             под несколькими родителями.
#   space   — (необязательно) ключ пространства для дополнительной фильтрации.
#             Если не указан, отбор ограничен только поддеревом source.
#   name    — (необязательно) имя правила для логов.

rules:
  - name: drafts-to-published
    source: "111111"
    labels:
      - ready
      - approved
    target: "333333"
    space: DOCS

  - name: archive
    source: "222222"
    labels: to-archive
    target: "444444"


# ── mentions: сбор @упоминаний из таблицы в плейсхолдер ──────────────────────
# На каждой отобранной странице бот читает людей, отмеченных виджетом @человек
# в заданном столбце таблицы, и складывает их в ячейку-плейсхолдер той же
# страницы.
#
#   root        — ID корневой страницы: берутся страницы из её поддерева.
#   labels      — лейблы, по которым отбираются подстраницы. Несколько = ИЛИ.
#   column      — заголовок столбца-источника. Можно список: тогда люди из всех
#                 перечисленных столбцов складываются в один плейсхолдер.
#   placeholder — имя строки-приёмника. Бот ищет строку, в первой ячейке которой
#                 стоит это имя, и перезаписывает её вторую ячейку.
#   space       — (необязательно) ключ пространства для дополнительной фильтрации.
#   name        — (необязательно) имя правила для логов.
#
# Плейсхолдер нужно создать руками — бот не дописывает разметку в чужие страницы.
# Достаточно обычной таблицы из двух столбцов; подойдёт и таблица внутри макроса
# Page Properties, тогда Page Properties Report соберёт сводку по подстраницам
# сам. Выглядит это так:
#
#   | Участники |          |  ← бот пишет во вторую ячейку
#   | Статус    | В работе |
#
# Регистр и лишние пробелы в именах столбца и плейсхолдера не важны.
# Один и тот же плейсхолдер в одном поддереве нельзя занять двумя правилами:
# они бы затирали друг друга через проход.

mentions:
  - name: release-owners
    root: "555555"
    labels: release
    column: Ответственный
    placeholder: Участники

  - name: release-reviewers
    root: "555555"
    labels: release
    column:
      - Ревьюер
      - Согласующий
    placeholder: Ревьюеры
    space: DOCS
